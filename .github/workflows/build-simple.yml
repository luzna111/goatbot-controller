name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Create package.json
        run: |
          echo '{
            "name": "goatbot-controller",
            "version": "1.0.0",
            "scripts": {
              "build": "mkdir -p dist && cp index.html dist/"
            }
          }' > package.json
      
      - name: Create index.html
        run: |
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>GoatBot H1 Control</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { 
                background: #0f172a; 
                color: white; 
                font-family: system-ui, sans-serif;
                min-height: 100vh;
                overflow-x: hidden;
              }
              .screen {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
              }
              h1 { color: #10b981; margin-bottom: 10px; }
              .subtitle { color: #64748b; margin-bottom: 30px; text-align: center; }
              .btn {
                background: #10b981;
                color: white;
                border: none;
                padding: 18px 40px;
                border-radius: 12px;
                font-size: 18px;
                cursor: pointer;
                margin: 10px;
                width: 100%;
                max-width: 300px;
              }
              .btn-secondary { background: #334155; }
              .joystick-area {
                width: 250px;
                height: 250px;
                background: #1e293b;
                border-radius: 50%;
                position: relative;
                margin: 30px auto;
                border: 3px solid #334155;
              }
              .joystick-knob {
                width: 80px;
                height: 80px;
                background: linear-gradient(135deg, #34d399, #10b981);
                border-radius: 50%;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
              }
              .status-card {
                background: #1e293b;
                padding: 20px;
                border-radius: 16px;
                margin: 15px 0;
                width: 100%;
                max-width: 400px;
              }
              .status-row {
                display: flex;
                justify-content: space-between;
                padding: 8px 0;
                border-bottom: 1px solid #334155;
              }
              .status-row:last-child { border-bottom: none; }
              .connected { color: #10b981; }
              .label { color: #94a3b8; }
              .value { color: white; font-weight: 600; }
              .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
              .hidden { display: none !important; }
            </style>
          </head>
          <body>
            <!-- Connect Screen -->
            <div id="connectScreen" class="screen">
              <div style="font-size: 64px; margin-bottom: 20px;">🤖</div>
              <h1>GoatBot Unicut H1</h1>
              <p class="subtitle">Mower Disconnected<br>Tap below to connect</p>
              <button class="btn" onclick="app.connect()">🔌 Connect to Mower</button>
              <p style="color: #475569; font-size: 12px; margin-top: 40px; text-align: center;">
                Made by E-KANG Intelligent Technology<br>(移康智能科技)<br><br>
                Connection: BLE → WiFi → Alibaba Cloud IoT
              </p>
            </div>

            <!-- Main Control Screen -->
            <div id="mainScreen" class="screen hidden">
              <h1>🤖 GoatBot H1</h1>
              <p class="connected">● Connected via Cloud</p>
              
              <div class="status-card">
                <div class="status-row">
                  <span class="label">🔋 Battery</span>
                  <span class="value" id="battery">78%</span>
                </div>
                <div class="status-row">
                  <span class="label">📶 Signal</span>
                  <span class="value" id="signal">85%</span>
                </div>
                <div class="status-row">
                  <span class="label">🌡️ Temperature</span>
                  <span class="value" id="temp">42°C</span>
                </div>
                <div class="status-row">
                  <span class="label">⏱️ Runtime</span>
                  <span class="value">20h 47m</span>
                </div>
              </div>

              <div class="joystick-area" id="joystick">
                <div class="joystick-knob" id="knob"></div>
              </div>
              <p style="color: #64748b; font-size: 14px;">Drag to control movement</p>

              <div class="controls" style="width: 100%; max-width: 400px;">
                <button class="btn" onclick="app.toggleBlade()">✂️ Toggle Blade</button>
                <button class="btn btn-secondary" onclick="app.returnHome()">🏠 Return Home</button>
              </div>
              
              <button class="btn btn-secondary" onclick="app.disconnect()" style="margin-top: 20px;">❌ Disconnect</button>
            </div>

            <script>
              const app = {
                connected: false,
                
                connect() {
                  this.connected = true;
                  document.getElementById('connectScreen').classList.add('hidden');
                  document.getElementById('mainScreen').classList.remove('hidden');
                  
                  // Simulate live updates
                  setInterval(() => {
                    if (!this.connected) return;
                    document.getElementById('battery').textContent = Math.floor(70 + Math.random() * 20) + '%';
                    document.getElementById('signal').textContent = Math.floor(80 + Math.random() * 15) + '%';
                  }, 5000);
                },
                
                disconnect() {
                  this.connected = false;
                  document.getElementById('mainScreen').classList.add('hidden');
                  document.getElementById('connectScreen').classList.remove('hidden');
                },
                
                toggleBlade() {
                  alert('Blade toggled! (Demo mode)');
                },
                
                returnHome() {
                  alert('Returning to base... (Demo mode)');
                }
              };

              // Joystick control
              const joystick = document.getElementById('joystick');
              const knob = document.getElementById('knob');
              let dragging = false;

              const handleStart = (e) => {
                dragging = true;
                const touch = e.touches ? e.touches[0] : e;
                moveKnob(touch);
              };

              const handleMove = (e) => {
                if (!dragging) return;
                const touch = e.touches ? e.touches[0] : e;
                moveKnob(touch);
              };

              const handleEnd = () => {
                dragging = false;
                knob.style.transform = 'translate(-50%, -50%)';
              };

              const moveKnob = (touch) => {
                const rect = joystick.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const maxDist = 85;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxDist) {
                  dx = (dx / dist) * maxDist;
                  dy = (dy / dist) * maxDist;
                }

                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
              };

              joystick.addEventListener('mousedown', handleStart);
              joystick.addEventListener('touchstart', handleStart);
              window.addEventListener('mousemove', handleMove);
              window.addEventListener('touchmove', handleMove);
              window.addEventListener('mouseup', handleEnd);
              window.addEventListener('touchend', handleEnd);
            </script>
          </body>
          </html>
          HTMLEOF
      
      - name: Build
        run: npm run build
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Capacitor
        run: npm install -g @capacitor/cli
      
      - name: Init Capacitor
        run: npx cap init GoatBotH1 io.goatbot.control --web-dir dist --skip
      
      - name: Add Android
        run: npx cap add android
      
      - name: Sync
        run: npx cap sync
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goatbot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
