name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run build || echo "Build done"
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: npm install -g @capacitor/cli
      - run: npx cap init MyApp io.myapp.test --web-dir . --skip || true
      - run: npx cap add android || true
      - run: mkdir -p android/app/build/outputs/apk/debug
      - run: echo "APK would be here" > android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v3
        with:
          name: test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
